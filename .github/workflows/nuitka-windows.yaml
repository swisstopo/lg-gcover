name: Nuitka Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ feature_nuitka_build ]
    tags:
      - "v*.*.*"

env:
  CONDA_ENV: GCOVER_NUITKA
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"

jobs:
  nuitka-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Disable Windows Defender real-time scanning
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install miniconda
        uses: conda-incubator/setup-miniconda@v4.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          auto-update-conda: true
          channels: conda-forge,defaults
          channel-priority: true
          activate-environment: ${{ env.CONDA_ENV }}

      - name: Cache conda environment
        uses: actions/cache@v5
        with:
          path: C:\Miniconda\envs\${{ env.CONDA_ENV }}
          key: nuitka-conda-win-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            nuitka-conda-win-${{ env.PYTHON_VERSION }}-

      - name: Install libmamba solver
        shell: bash -el {0}
        run: conda install -n base -y conda-libmamba-solver

      - name: Install GIS + runtime dependencies
        shell: bash -el {0}
        run: |
          conda install -y --solver=libmamba \
            duckdb pip gdal geopandas shapely pandas \
            click rich pydantic pyyaml structlog python-dotenv loguru \
            fiona pyogrio boto3 openpyxl dateparser \
            setuptools setuptools-scm

      - name: Cache Nuitka downloads (depends.exe etc.)
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-dl-cache-win-${{ env.PYTHON_VERSION }}

      - name: Install Nuitka
        shell: bash -el {0}
        run: pip install nuitka ordered-set zstandard

      - name: Install gcover package
        shell: bash -el {0}
        run: pip install -e ".[dev,cloud]" --no-deps

      - name: Get version from SCM
        shell: bash -el {0}
        id: version
        run: echo "version=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"

      - name: Write entrypoint script
        shell: bash -el {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("_gcover_main.py").write_text(
              "from gcover.cli.main import cli\nif __name__ == '__main__':\n    cli()\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve GDAL / PROJ data directories
        shell: bash -el {0}
        id: datadirs
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path

          prefix = Path(sys.prefix)
          gdal_data = os.environ.get("GDAL_DATA") or str(prefix / "Library" / "share" / "gdal")
          proj_data = str(prefix / "Library" / "share" / "proj")

          try:
              from pyproj import datadir
              proj_data = datadir.get_data_dir()
          except Exception:
              pass

          print(f"gdal_data: {gdal_data}")
          print(f"proj_data: {proj_data}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"gdal_data={gdal_data}\n")
              f.write(f"proj_data={proj_data}\n")
          PY

      - name: Compile with Nuitka
        shell: bash -el {0}
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --nofollow-imports \
            --follow-import-to=gcover \
            --include-package=gcover \
            --include-package-data=gcover \
            --include-package=fiona \
            --include-package=pyogrio \
            --include-package=osgeo \
            --include-package=duckdb \
            --include-package=click \
            --include-package=rich \
            --include-package=pydantic \
            --include-package=structlog \
            --include-package=loguru \
            --include-package=yaml \
            --include-package=dotenv \
            --include-package=boto3 \
            --include-package=botocore \
            --include-data-dir="${{ steps.datadirs.outputs.gdal_data }}=gdal-data" \
            --include-data-dir="${{ steps.datadirs.outputs.proj_data }}=proj-data" \
            --output-dir=nuitka_output \
            --output-filename=gcover.exe \
            --windows-console-mode=attach \
            --jobs=4 \
            --lto=no \
            _gcover_main.py

      - name: Package distribution folder
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path nuitka_output\gcover.dist -DestinationPath "gcover-windows-$version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: gcover-windows-${{ steps.version.outputs.version }}
          path: gcover-windows-*.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: gcover-windows-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
